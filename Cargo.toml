[package]
name = "drivesync"
version = "0.1.2"
edition = "2021"
rust-version = "1.74"
description = "CLI para sincronizar archivos y carpetas con Google Drive usando un token de Google"
license = "MIT"

[[bin]]
name = "drivesync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6.0"
md-5 = "0.10"
percent-encoding = "2.3"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
md-5 = "0.10"
percent-encoding = "2.3"
serde_json = "1.0"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
