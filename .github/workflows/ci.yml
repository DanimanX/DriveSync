name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag ya existente para publicar una release (ej. v0.0.1)"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  calidad:
    name: Formato, lints y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Pruebas
        run: cargo test --locked --all-targets

  compilar:
    name: Compilar release
    needs: calidad
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain de Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Caché de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Enlazador cruzado (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Compilar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empaquetar binario
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          name="drivesync-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/drivesync" "dist/${name}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}" "${name}.tar.gz" > "SHA256SUMS-${{ matrix.target }}.txt")
          file "dist/${name}"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: drivesync-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publicar-release:
    name: Publicar release con binarios
    needs: compilar
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verificar binarios
        run: |
          set -euo pipefail
          ls -lh dist
          host=$(uname -m)
          echo "Arquitectura del runner: $host"
          for bin in dist/drivesync-*-*; do
            case "$bin" in
              *.tar.gz|*.txt) continue ;;
            esac
            # upload-artifact no conserva el bit de ejecución.
            chmod +x "$bin"
            file "$bin"
            case "$(basename "$bin")" in
              *x86_64*) want=x86_64 ;;
              *aarch64*) want=aarch64 ;;
              *) want="" ;;
            esac
            if [ "$want" = "$host" ]; then
              echo "Ejecutando $(basename "$bin"):"
              "$bin" --version
            else
              echo "Saltando ejecución: binario $want, runner $host"
            fi
          done

      - name: Escribir notas de la release
        run: |
          set -euo pipefail
          ver=$(ls dist | sed -n 's/^drivesync-\(.*\)-x86_64-unknown-linux-gnu$/\1/p' | head -1)
          [ -n "$ver" ] || { echo "no se pudo deducir la versión de los artefactos"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          {
            echo "Binarios de drivesync $ver para Linux (x86_64 y aarch64)."
            echo
            echo 'Descarga el de tu arquitectura, dale permisos de ejecución y comprueba la versión:'
            echo
            echo '```bash'
            echo "chmod +x drivesync-$ver-x86_64-unknown-linux-gnu"
            echo "./drivesync-$ver-x86_64-unknown-linux-gnu --version"
            echo '```'
            echo
            echo 'Verifica la integridad con el archivo `SHA256SUMS-<target>.txt` correspondiente.'
            echo
            echo 'Compilado desde el tag por GitHub Actions.'
          } > notas.md
          cat notas.md

      - name: Crear o actualizar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release $TAG ya existe: se actualizan los adjuntos."
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "drivesync $TAG" \
              --notes-file notas.md \
              --verify-tag
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name) (\(.size) bytes) → \(.url)"'
